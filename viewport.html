<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Photos</title>  <!-- CHANGE: page title shown in browser tab -->
  <style>
    body {
      padding: 1em;
      font-size: 13px;
      overflow-x: hidden;
      background: #e6d6c9/* white;           /* CHANGE: default background colour -->
      font-family: Georgia, serif; /* CHANGE: font -->
    }

    a {
      color: black; /* CHANGE: link colour */
    }

    img {
      max-width: 20vw; /* CHANGE: how big the images are (20% of screen width) */
    }

    #caption {
      max-width: 90vw;
      position: absolute;
      z-index: 999;
      background: white; /* CHANGE: caption box background colour */
      padding: 4px 8px;
      display: none;
    }
  </style>
</head>
<body>

  <a href="index.html">&larr; Go back</a>  <!-- CHANGE: link text and destination -->

  <!-- ============================================================
    IMAGES
    For each image, change:
      src=        the image filename (put your images in an "img" folder)
      data-title= the caption shown on hover
      data-bg=    the background colour shown on hover (any CSS colour name or hex code)
      rotate(Xdeg) the tilt angle — use negative numbers to tilt the other way
  =============================================================== -->

  <img src="pics/albino-calf.jpg" class="scatter"
       data-title="An albino calf in the mountains of North Vietnam"
       data-bg="#d1b098"
       style="transform: rotate(3deg)">

  <img src="pics/beach.jpg" class="scatter"
       data-title="Seaside attractions near Ramsgate, UK"
       data-bg="#a7b3ae"
       style="transform: rotate(-2deg)">

  <img src="pics/market.jpg" class="scatter"
       data-title="Portobello Road Market in the spring sun"
       data-bg="#b46f4d"
       style="transform: rotate(1deg)">

  <img src="pics/herzegovina.jpg" class="scatter"
       data-title="Šišman Ibrahim Pasha Mosque in Herzegovina"
       data-bg="#6a6b48"
       style="transform: rotate(-3deg)">

  <img src="pics/pico-de-las-nieves.jpg" class="scatter"
       data-title="Pico de las Nieves, Gran Canaria"
       data-bg="#e7d0bf"
       style="transform: rotate(2deg)">

  <img src="pics/hmong-village.jpg" class="scatter"
       data-title="View across the valley from Ms Co's Homestay"
       data-bg="#876228"
       style="transform: rotate(3deg)">

  <img src="pics/lock-laidon.jpg" class="scatter"
       data-title="View over Loch Laidon"
       data-bg="#b0a8a5"
       style="transform: rotate(-2deg)">

  <img src="pics/seven-sisters.jpg" class="scatter"
       data-title="Davide, Elena and Nacho strolling down towards the Seven Sisters"
       data-bg="#445426"
       style="transform: rotate(1deg)">

  <!-- To add more images, copy one of the blocks above and paste it here -->

  <div id="caption"></div>

    <script>
    const caption = document.getElementById('caption');
    const scatter = document.querySelectorAll('.scatter');
    let doit;

    function scatterThem() {
        scatter.forEach(function(s) {
        let windowWidth = window.innerWidth;
        let windowHeight = window.innerHeight;

        let imgWidth = s.offsetWidth;
        let imgHeight = s.offsetHeight;

        s.style.position = 'absolute';
        s.style.top  = Math.floor(Math.random() * (windowHeight - imgHeight)) + "px";
        s.style.left = Math.floor(Math.random() * (windowWidth  - imgWidth))  + "px";

        s.addEventListener('mouseover', function() {
            s.style.zIndex = 800;
            caption.style.display = 'block';
            caption.innerHTML = s.dataset.title ? s.dataset.title : '';
            document.querySelector('body').style.background = s.dataset.bg ? s.dataset.bg : 'e6d6c9';
        });

        s.addEventListener('mouseout', function() {
            s.style.zIndex = '';
            caption.style.display = 'none';
            document.querySelector('body').style.background = 'white';
        });
        });
    }

    document.addEventListener('mousemove', function(e) {
        caption.style.left = (e.pageX + 10) + "px";
        caption.style.top  = (e.pageY + 10) + "px";
    });

    document.addEventListener('load', scatterThem());
    window.addEventListener('resize', () => {
        clearTimeout(doit);
        doit = setTimeout(scatterThem, 100);
    });
    </script>
<br>
 <a href="pics.html">A more ordered view</a>  <!-- CHANGE: link text and destination -->
</body>
</html>
